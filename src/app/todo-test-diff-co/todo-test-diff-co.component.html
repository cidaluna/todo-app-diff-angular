<div class="container">
  <h2>Comparador de Objetos</h2>

  <div class="side-by-side">
    <div class="panel">
      <h3>Antes</h3>
      <app-json-renderer-line [lines]="beforeLines"></app-json-renderer-line>
    </div>

    <div class="panel">
      <h3>Depois</h3>
      <app-json-renderer-line [lines]="afterLines"></app-json-renderer-line>
    </div>
  </div>
</div>
